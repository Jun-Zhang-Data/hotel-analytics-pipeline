version: 2

models:
  - name: stg_hotels
    columns:
      - name: hotel_id
        data_tests:
          - not_null
          - unique

  - name: stg_bookings
    columns:
      - name: booking_id
        data_tests:
          - not_null
      - name: hotel_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hotels')
                field: hotel_id
      - name: booking_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONFIRMED', 'CANCELLED']

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
