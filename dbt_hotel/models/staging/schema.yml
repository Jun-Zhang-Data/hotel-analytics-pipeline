version: 2

models:
  - name: stg_bookings
    columns:
      - name: booking_id
        data_tests:
          - not_null
      - name: source_system_code
        data_tests:
          - not_null
      - name: source_hotel_code
        data_tests:
          - not_null
      - name: booking_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONFIRMED', 'CANCELLED']

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
