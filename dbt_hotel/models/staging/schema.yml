version: 2

models:
  - name: stg_hotels
    columns:
      - name: hotel_id
        data_tests:
          - not_null
          - unique

  - name: stg_bookings
    columns:
      - name: booking_id
        data_tests:
          - not_null
      - name: hotel_id
        data_tests:
          - not_null

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
