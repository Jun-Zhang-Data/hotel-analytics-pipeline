version: 2

models:
  - name: mart_hotel_daily
    description: Daily hotel-level booking and revenue metrics.
    columns:
      - name: booking_date
        data_tests:
          - not_null
      - name: hotel_id
        data_tests:
          - not_null

  - name: mart_dq_daily
    description: Daily data-quality KPI summary for reporting.
    columns:
      - name: check_date
        data_tests:
          - not_null
      - name: records_checked
        data_tests:
          - not_null
      - name: dq_pass_rate
        data_tests:
          - not_null

  - name: mart_dq_by_source
    description: Data-quality KPI summary by source system.
    columns:
      - name: check_date
        data_tests:
          - not_null
      - name: source_system_code
        data_tests:
          - not_null
      - name: mapping_coverage_rate
        data_tests:
          - not_null

  - name: mart_exception_register
    description: Current structured DQ exceptions enriched with latest append-only lifecycle action.
    columns:
      - name: exception_id
        data_tests:
          - not_null
          - unique
      - name: rule_id
        data_tests:
          - not_null
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values: ['INFO', 'WARNING', 'BLOCKING']
      - name: exception_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['OPEN', 'ACKNOWLEDGED', 'RESOLVED', 'REPROCESSED']

  - name: mart_exception_summary
    description: Exception counts by date, source, rule, quality dimension and lifecycle status.
    columns:
      - name: detected_date
        data_tests:
          - not_null
      - name: rule_id
        data_tests:
          - not_null
      - name: exception_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['OPEN', 'ACKNOWLEDGED', 'RESOLVED', 'REPROCESSED']
      - name: exception_count
        data_tests:
          - not_null

  - name: mart_power_bi_hotel_daily
    description: Power BI-ready daily hotel operational metrics enriched with hotel attributes and pre-calculated rates.
    columns:
      - name: booking_date
        data_tests:
          - not_null
      - name: hotel_id
        data_tests:
          - not_null
      - name: hotel_name
        data_tests:
          - not_null
      - name: total_bookings
        data_tests:
          - not_null
      - name: cancellation_rate
        data_tests:
          - not_null
      - name: revenue_per_booking
        data_tests:
          - not_null

  - name: mart_power_bi_dq_rule_daily
    description: Power BI-ready daily data-quality results at source-system and rule grain.
    columns:
      - name: check_date
        data_tests:
          - not_null
      - name: source_system_code
        data_tests:
          - not_null
      - name: rule_id
        data_tests:
          - not_null
      - name: quality_dimension
        data_tests:
          - accepted_values:
              arguments:
                values: ['MAPPING_COVERAGE', 'COMPLETENESS', 'VALIDITY']
      - name: records_checked
        data_tests:
          - not_null
      - name: pass_rate
        data_tests:
          - not_null
