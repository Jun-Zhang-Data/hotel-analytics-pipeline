name: dbt CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U analytics -d hotel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics
      DB_NAME: hotel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 psycopg2-binary==2.9.10 dbt-postgres==1.9.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize warehouse schemas and raw tables
        env:
          PGPASSWORD: analytics
        run: |
          psql -h localhost -U analytics -d hotel -f scripts/init_warehouse.sql

      - name: Generate sample data
        run: python scripts/generate_data.py

      - name: Load raw data
        run: python scripts/load_raw.py

      - name: Validate dbt project
        working-directory: dbt_hotel
        run: dbt debug --profiles-dir . --target dev

      - name: Build and test dbt project
        working-directory: dbt_hotel
        run: dbt build --profiles-dir . --target dev
