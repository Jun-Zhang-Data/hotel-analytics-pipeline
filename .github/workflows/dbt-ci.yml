name: dbt CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U analytics -d hotel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics
      DB_NAME: hotel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 psycopg2-binary==2.9.10 dbt-postgres==1.9.0 PyYAML==6.0.2 openai==3.26.1 ruff==0.13.2

      - name: Lint Python
        run: ruff check scripts semantic_api tests airflow/dags

      - name: Compile Python
        run: python -m compileall -q scripts semantic_api tests airflow/dags

      - name: Test semantic layer
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize warehouse schemas and raw tables
        env:
          PGPASSWORD: analytics
        run: |
          psql -h localhost -U analytics -d hotel -f scripts/init_warehouse.sql

      - name: Generate sample data
        run: python scripts/generate_data.py

      - name: Validate source contracts
        run: python scripts/validate_source_contracts.py

      - name: Prove breaking source contract is blocked and recoverable
        shell: bash
        run: |
          cp data/bookings.csv /tmp/bookings.csv
          trap 'mv /tmp/bookings.csv data/bookings.csv' EXIT

          python - <<'PY'
          import pandas as pd

          path = "data/bookings.csv"
          df = pd.read_csv(path)
          df = df.drop(columns=["source_hotel_code"])
          df.to_csv(path, index=False)
          PY

          set +e
          python scripts/validate_source_contracts.py
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Expected breaking source contract validation to fail, but it passed."
            exit 1
          fi

          mv /tmp/bookings.csv data/bookings.csv
          trap - EXIT
          python scripts/validate_source_contracts.py

      - name: Load raw data
        run: python scripts/load_raw.py --run-id ci-first-load

      - name: Prove idempotent re-run
        run: python scripts/load_raw.py --run-id ci-idempotency-rerun

      - name: Assert second load inserted no duplicates
        env:
          PGPASSWORD: analytics
        run: |
          test "$(psql -h localhost -U analytics -d hotel -Atc "select coalesce(sum(inserted_rows), -1) from ops.ingestion_runs where run_id='ci-idempotency-rerun';")" = "0"

      - name: Validate dbt project
        working-directory: dbt_hotel
        run: dbt debug --profiles-dir . --target dev

      - name: Build and test dbt project
        working-directory: dbt_hotel
        run: dbt build --profiles-dir . --target dev

      - name: Assert semantic domain schemas are built
        env:
          PGPASSWORD: analytics
        run: |
          test "$(psql -h localhost -U analytics -d hotel -Atc "select to_regclass('analytics_dev_ops.mart_power_bi_hotel_daily') is not null;")" = "t"
          test "$(psql -h localhost -U analytics -d hotel -Atc "select to_regclass('analytics_dev_dq.mart_power_bi_dq_rule_daily') is not null;")" = "t"

      - name: Configure semantic least-privilege roles
        run: python scripts/configure_semantic_access.py

      - name: Prove semantic roles cannot cross domains
        shell: bash
        env:
          PGPASSWORD: analytics
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U analytics -d hotel -c "set role hotel_ops_reader; select count(*) from analytics_dev_ops.mart_power_bi_hotel_daily;"
          psql -v ON_ERROR_STOP=1 -h localhost -U analytics -d hotel -c "set role data_quality_reader; select count(*) from analytics_dev_dq.mart_power_bi_dq_rule_daily;"

          if psql -v ON_ERROR_STOP=1 -h localhost -U analytics -d hotel -c "set role hotel_ops_reader; select count(*) from analytics_dev_dq.mart_power_bi_dq_rule_daily;"; then
            echo "hotel_ops_reader unexpectedly accessed the data-quality domain."
            exit 1
          fi

          if psql -v ON_ERROR_STOP=1 -h localhost -U analytics -d hotel -c "set role data_quality_reader; select count(*) from analytics_dev_ops.mart_power_bi_hotel_daily;"; then
            echo "data_quality_reader unexpectedly accessed the hotel-operations domain."
            exit 1
          fi

      - name: Assert incremental watermarks initialized
        env:
          PGPASSWORD: analytics
        run: |
          test "$(psql -h localhost -U analytics -d hotel -Atc "select count(*) from ops.incremental_model_watermarks where model_name in ('int_booking_current_state','mart_hotel_daily');")" = "4"

      - name: Prove exception lifecycle action persists across rebuild
        shell: bash
        env:
          PGPASSWORD: analytics
        run: |
          exception_id="$(psql -h localhost -U analytics -d hotel -Atc "select exception_id from analytics_dev.mart_exception_register order by exception_id limit 1;")"
          test -n "$exception_id"

          python scripts/manage_dq_exception.py \
            --exception-id "$exception_id" \
            --status ACKNOWLEDGED \
            --actor ci \
            --note "CI lifecycle persistence check"

          cd dbt_hotel
          dbt build --profiles-dir . --target dev
          cd ..

          test "$(psql -h localhost -U analytics -d hotel -Atc "select exception_status from analytics_dev.mart_exception_register where exception_id='$exception_id';")" = "ACKNOWLEDGED"
          test "$(psql -h localhost -U analytics -d hotel -Atc "select count(*) from ops.dq_exception_actions where exception_id='$exception_id' and action_status='ACKNOWLEDGED';")" = "1"

      - name: Prove late-arriving update uses changed-key incremental processing
        shell: bash
        env:
          PGPASSWORD: analytics
        run: |
          unaffected_before="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B002';")"
          changed_before="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B001';")"

          python scripts/reliability_scenarios.py append-late-arrival
          python scripts/validate_source_contracts.py
          python scripts/load_raw.py --dataset bookings --start-date 2026-09-01 --end-date 2026-09-01 --run-id ci-late-arrival
          cd dbt_hotel
          dbt build --profiles-dir . --target dev
          cd ..
          python scripts/reliability_scenarios.py assert-late-arrival

          unaffected_after="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B002';")"
          changed_after="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B001';")"
          test "$unaffected_before" = "$unaffected_after"
          test "$changed_before" != "$changed_after"

      - name: Prove historical correction can be safely backfilled incrementally
        shell: bash
        env:
          PGPASSWORD: analytics
        run: |
          unchanged_before="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B002';")"
          corrected_before="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B003';")"

          python scripts/reliability_scenarios.py append-historical-correction
          python scripts/validate_source_contracts.py
          python scripts/load_raw.py --dataset bookings --start-date 2026-09-01 --end-date 2026-09-01 --run-id ci-historical-correction
          cd dbt_hotel
          dbt build --profiles-dir . --target dev
          cd ..
          python scripts/reliability_scenarios.py assert-historical-correction

          unchanged_after="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B002';")"
          corrected_after="$(psql -h localhost -U analytics -d hotel -Atc "select processed_at::text from analytics_dev.int_booking_current_state where booking_id='B003';")"
          test "$unchanged_before" = "$unchanged_after"
          test "$corrected_before" != "$corrected_after"

      - name: Prove incremental and full-refresh outputs are equivalent
        shell: bash
        env:
          PGPASSWORD: analytics
        run: |
          fact_before="$(psql -h localhost -U analytics -d hotel -Atc "select md5(coalesce(string_agg(concat_ws('|', booking_id, hotel_id, guest_id, booking_date::text, check_in_date::text, check_out_date::text, booking_status, revenue::text, booking_lead_days::text), '||' order by booking_id), '')) from analytics_dev.fct_bookings;")"
          mart_before="$(psql -h localhost -U analytics -d hotel -Atc "select md5(coalesce(string_agg(concat_ws('|', booking_date::text, hotel_id, total_bookings::text, cancelled_bookings::text, total_revenue::text), '||' order by booking_date, hotel_id), '')) from analytics_dev.mart_hotel_daily;")"

          cd dbt_hotel
          dbt build --full-refresh --profiles-dir . --target dev
          cd ..

          fact_after="$(psql -h localhost -U analytics -d hotel -Atc "select md5(coalesce(string_agg(concat_ws('|', booking_id, hotel_id, guest_id, booking_date::text, check_in_date::text, check_out_date::text, booking_status, revenue::text, booking_lead_days::text), '||' order by booking_id), '')) from analytics_dev.fct_bookings;")"
          mart_after="$(psql -h localhost -U analytics -d hotel -Atc "select md5(coalesce(string_agg(concat_ws('|', booking_date::text, hotel_id, total_bookings::text, cancelled_bookings::text, total_revenue::text), '||' order by booking_date, hotel_id), '')) from analytics_dev.mart_hotel_daily;")"

          test "$fact_before" = "$fact_after"
          test "$mart_before" = "$mart_after"

      - name: Exercise operational health checks against deterministic fixture
        env:
          TARGET_SCHEMA: analytics_dev
          FRESHNESS_WARNING_HOURS: "1000"
          FRESHNESS_BLOCKING_HOURS: "2000"
          DQ_WARNING_PASS_RATE: "0.85"
          DQ_BLOCKING_PASS_RATE: "0.70"
          MAPPING_WARNING_RATE: "0.90"
          MAPPING_BLOCKING_RATE: "0.80"
        run: python scripts/check_operational_health.py
